name: pr-check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    env:
      GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap moolu-build-logic 1.0.0-SNAPSHOT to mavenLocal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:$GH_TOKEN@github.com/changyue1053/moolu-build-logic.git" /tmp/moolu-build-logic
          (cd /tmp/moolu-build-logic && ./gradlew :convention:publishToMavenLocal --no-daemon)
          test -f ~/.m2/repository/moolu/kmp/library/moolu.kmp.library.gradle.plugin/1.0.0-SNAPSHOT/moolu.kmp.library.gradle.plugin-1.0.0-SNAPSHOT.pom

      - name: Bootstrap moolu-foundation 1.0.1-SNAPSHOT to mavenLocal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:$GH_TOKEN@github.com/changyue1053/moolu-foundation.git" /tmp/moolu-foundation
          (cd /tmp/moolu-foundation && ./gradlew :foundation:publishToMavenLocal --no-daemon)
          test -d ~/.m2/repository/app/moolu/moolu-foundation-iosarm64/1.0.1-SNAPSHOT  # plan-03 T5 regression guard

      - name: Bootstrap moolu-network 1.0.0-SNAPSHOT to mavenLocal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:$GH_TOKEN@github.com/changyue1053/moolu-network.git" /tmp/moolu-network
          (cd /tmp/moolu-network && ./gradlew :network:publishToMavenLocal --no-daemon)
          test -d ~/.m2/repository/app/moolu/moolu-network-iosarm64/1.0.0-SNAPSHOT  # plan-03 T5 regression guard

      - name: ktlintCheck
        run: ./gradlew ktlintCheck --no-daemon

      - name: Architecture (Konsist PackageNamingTest)
        run: ./gradlew :architecture-test:test --no-daemon

      - name: KMP allTests (Android + iosSimulatorArm64 双平台 per ADR-base-002 TDD strict)
        run: ./gradlew :ai:allTests --no-daemon

      - name: ABI lock (apiCheck — binary-compat-validator gate per master plan §6.3 / ADR-base-019 §A1)
        run: ./gradlew :ai:apiCheck --no-daemon

      - name: publishToMavenLocal + verify artifacts (含 plan-03 T5 iOS regression guard + ERRATA #1 prefix-only fix)
        run: |
          ./gradlew :ai:publishToMavenLocal --no-daemon
          test -f ~/.m2/repository/app/moolu/moolu-ai/1.0.0-SNAPSHOT/moolu-ai-1.0.0-SNAPSHOT.module
          test -f ~/.m2/repository/app/moolu/moolu-ai-android/1.0.0-SNAPSHOT/moolu-ai-android-1.0.0-SNAPSHOT.aar
          test -d ~/.m2/repository/app/moolu/moolu-ai-iosarm64/1.0.0-SNAPSHOT  # plan-03 T5 regression guard + ERRATA #1
          test -d ~/.m2/repository/app/moolu/moolu-ai-iossimulatorarm64/1.0.0-SNAPSHOT
