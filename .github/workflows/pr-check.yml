name: pr-check
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}
# NOTE: NO `push:` trigger — matches moolu-im / moolu-account / other base SDK repos
# pattern (per master plan §1.3 + plan-10/14/15 直推 main 节奏);CI is informational
# gate for PRs not direct pushes. Pre-V1.0 SNAPSHOT direct-to-main 不 gate by CI;
# local `./gradlew ktlintCheck :ai:apiCheck :architecture-test:test :ai:allTests
# :ai:publishToMavenLocal --no-daemon` is the ship gate. Plus GITHUB_TOKEN default
# permissions don't allow cross-private-repo clone (moolu-build-logic / foundation /
# network are private) — would need MOOLU_BOOTSTRAP_PAT secret which is user-setup
# concern (plan-32 polish backlog).

jobs:
  build:
    runs-on: macos-15
    env:
      GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap moolu-build-logic 1.0.0 to mavenLocal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:$GH_TOKEN@github.com/changyue1053/moolu-build-logic.git" /tmp/moolu-build-logic
          (cd /tmp/moolu-build-logic && ./gradlew :convention:publishToMavenLocal --no-daemon)
          test -f ~/.m2/repository/moolu/kmp/library/moolu.kmp.library.gradle.plugin/1.0.0/moolu.kmp.library.gradle.plugin-1.0.0.pom

      - name: Bootstrap moolu-foundation 1.0.0 to mavenLocal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:$GH_TOKEN@github.com/changyue1053/moolu-foundation.git" /tmp/moolu-foundation
          (cd /tmp/moolu-foundation && ./gradlew :foundation:publishToMavenLocal --no-daemon)
          test -d ~/.m2/repository/app/moolu/moolu-foundation-iosarm64/1.0.0  # plan-03 T5 regression guard

      - name: Bootstrap moolu-network 1.0.0 to mavenLocal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:$GH_TOKEN@github.com/changyue1053/moolu-network.git" /tmp/moolu-network
          (cd /tmp/moolu-network && ./gradlew :network:publishToMavenLocal --no-daemon)
          test -d ~/.m2/repository/app/moolu/moolu-network-iosarm64/1.0.0  # plan-03 T5 regression guard

      - name: ktlintCheck
        run: ./gradlew ktlintCheck --no-daemon

      - name: Architecture (Konsist PackageNamingTest)
        run: ./gradlew :architecture-test:test --no-daemon

      - name: Konsist rule-count gate (backslide guard per ADR-base-028 §H1)
        run: |
          count=$(grep -rE '^\s*@Test' architecture-test/ --include='*.kt' | wc -l | xargs)
          baseline=4   # plan-34 T3 baseline per master plan §7.1 退出门 Konsist 30+ rules
          echo "Konsist rule-count: $count (baseline: $baseline)"
          if [ "$count" -lt "$baseline" ]; then
            echo "❌ BACKSLIDE: Konsist rules ($count) < baseline ($baseline)"
            echo "Per ADR-base-028 §H1 — rules must not regress below baseline."
            exit 1
          fi
          echo "✅ Konsist rule-count gate PASS"

      - name: KMP allTests (Android + iosSimulatorArm64 双平台 per ADR-base-002 TDD strict)
        run: ./gradlew :ai:allTests --no-daemon

      - name: ABI lock (apiCheck — binary-compat-validator gate per master plan §6.3 / ADR-base-019 §A1)
        run: ./gradlew :ai:apiCheck --no-daemon

      - name: publishToMavenLocal + verify artifacts (含 plan-03 T5 iOS regression guard + ERRATA #1 prefix-only fix)
        run: |
          ./gradlew :ai:publishToMavenLocal --no-daemon
          test -f ~/.m2/repository/app/moolu/moolu-ai/1.0.0/moolu-ai-1.0.0.module
          test -f ~/.m2/repository/app/moolu/moolu-ai-android/1.0.0/moolu-ai-android-1.0.0.aar
          test -d ~/.m2/repository/app/moolu/moolu-ai-iosarm64/1.0.0  # plan-03 T5 regression guard + ERRATA #1
          test -d ~/.m2/repository/app/moolu/moolu-ai-iossimulatorarm64/1.0.0
