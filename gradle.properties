# JVM
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Kotlin
kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9.0 + KMP library 实测可用 com.android.kotlin.multiplatform.library，不需要 demo-app 的
# android.builtInKotlin=false bypass。但保留同样的 .editorconfig + ktlint 豁免（plan-01 经验）。
